<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>教学图演示 · AI 教师</title>
<style>
  :root {
    --bg: #faf9f5;
    --surface: #ffffff;
    --line: #e2ded2;
    --text: #141413;
    --muted: #605e57;
    --brand: #a84f35;
    --brand-strong: #8f402b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; flex-direction: column;
    background: var(--bg); color: var(--text);
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    overflow: hidden;
  }
  header {
    flex: 0 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line);
  }
  header .title { font-weight: 800; font-size: 15px; letter-spacing: -.01em; margin-right: 6px; }
  header .title span { color: var(--brand); }
  select, button {
    font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 9px;
    border: 1px solid var(--line); background: #fff; color: var(--text); cursor: pointer;
  }
  select { padding-right: 26px; max-width: 210px; }
  button:hover { border-color: var(--brand); color: var(--brand); }
  button.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  button.primary:hover { background: var(--brand-strong); color: #fff; }
  #idx { color: var(--muted); font-size: 12.5px; margin-left: auto; font-variant-numeric: tabular-nums; }
  main {
    flex: 1 1 auto; display: flex; align-items: center; justify-content: center;
    padding: 14px; min-height: 0; overflow: hidden;
  }
  #stage {
    border-radius: 14px; overflow: hidden;
    box-shadow: 0 8px 30px rgba(0,0,0,.10);
    background: #1b2430;
  }
  footer {
    flex: 0 0 auto; padding: 10px 18px 14px; min-height: 46px;
    background: var(--surface); border-top: 1px solid var(--line);
    color: var(--muted); font-size: 13.5px; line-height: 1.65;
  }
  footer b { color: var(--brand); font-weight: 700; margin-right: 6px; }
  .hint { color: #9a958c; font-size: 12px; }
</style>
</head>
<body>
<header>
  <div class="title">教学图演示 <span>·</span> 边讲边画</div>
  <select id="pick"></select>
  <button id="prev">← 上一步</button>
  <button id="next" class="primary">下一步 →</button>
  <button id="play">自动播</button>
  <button id="last">最后一步</button>
  <span id="idx">—</span>
</header>
<main><div id="stage"></div></main>
<footer>
  <span id="narration" class="hint">选择一份示例，按「下一步」逐笔演示。方向键也可翻页。</span>
</footer>

<script src="../shared/engine.js"></script>
<script>
var CASES = [
  { file: 'board_pythagoras.json',    label: '勾股定理 · 手绘板书（board）' },
  { file: 'curve_sin.json',           label: '三角函数 y=sin x（curve）' },
  { file: 'curve_parabola.json',      label: '二次函数抛物线（curve）' },
  { file: 'flow_photosynthesis.json', label: '光合作用两阶段（flow）' },
  { file: 'concept_cell.json',        label: '细胞结构（concept）' },
  { file: 'timeline_atom.json',       label: '原子模型演变（timeline）' },
  { file: 'compare_mitosis.json',     label: '有丝分裂 vs 减数分裂（compare）' },
  { file: 'curve_supply_demand.json', label: '供求曲线（curve）' },
  { file: 'cycle_water.json',         label: '水循环（cycle）' },
  { file: 'layers_earth.json',        label: '地球圈层（layers）' }
];

var stage = document.getElementById('stage');
var pick = document.getElementById('pick');
var idxEl = document.getElementById('idx');
var narrEl = document.getElementById('narration');
var app = null;
var spec = null;
var timer = null;

CASES.forEach(function (c, i) {
  var o = document.createElement('option');
  o.value = c.file; o.textContent = c.label;
  pick.appendChild(o);
});

function ratioOf(canvas) {
  if (canvas === 'landscape') { return 16 / 9; }
  if (canvas === 'square') { return 1; }
  return 9 / 16;
}

function fitStage(canvas) {
  var ratio = ratioOf(canvas);
  var main = document.querySelector('main');
  var availW = main.clientWidth - 28;
  var availH = main.clientHeight - 28;
  var w = Math.min(availW, availH * ratio);
  var h = w / ratio;
  stage.style.width = Math.round(w) + 'px';
  stage.style.height = Math.round(h) + 'px';
}

function sync() {
  if (!app) { return; }
  idxEl.textContent = '第 ' + app.index + ' / ' + app.total + ' 步';
  var st = (spec.steps || [])[app.index - 1];
  if (st && st.narration) {
    narrEl.innerHTML = '<b>口播</b>' + st.narration;
  } else {
    narrEl.textContent = '（这一步没有配口播文案）';
  }
}

function load(file) {
  stopPlay();
  fetch('./examples/' + file)
    .then(function (r) { return r.json(); })
    .then(function (data) {
      spec = data;
      fitStage(spec.canvas || 'portrait');
      app = TeachDiagram.mount(spec, { stage: stage });
      if (app.total > 0) { app.next(); }
      sync();
    })
    .catch(function (err) {
      narrEl.textContent = '示例加载失败：' + err;
    });
}

function stopPlay() {
  if (timer) { clearInterval(timer); timer = null; }
  document.getElementById('play').textContent = '自动播';
}

document.getElementById('next').onclick = function () { if (app) { app.next(); sync(); } };
document.getElementById('prev').onclick = function () { if (app && app.prev) { app.prev(); sync(); } };
document.getElementById('last').onclick = function () {
  if (!app) { return; }
  while (app.index < app.total) { app.next(); }
  sync();
};
document.getElementById('play').onclick = function () {
  var btn = this;
  if (timer) { stopPlay(); return; }
  btn.textContent = '暂停';
  timer = setInterval(function () {
    if (!app || app.index >= app.total) { stopPlay(); return; }
    app.next(); sync();
  }, 4000);
};
pick.onchange = function () { load(this.value); };

document.addEventListener('keydown', function (e) {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); document.getElementById('next').click(); }
  else if (e.key === 'ArrowLeft') { document.getElementById('prev').click(); }
  else if (e.key === 'Home') { if (app) { while (app.index > 0 && app.prev) { app.prev(); } sync(); } }
  else if (e.key === 'End') { document.getElementById('last').click(); }
});

window.addEventListener('resize', function () {
  if (spec) { fitStage(spec.canvas || 'portrait'); }
});

load(CASES[0].file);
</script>
</body>
</html>
